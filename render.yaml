services:
  - type: web
    name: studyhub-web
    env: python
    plan: free
    buildCommand: ""
    startCommand: gunicorn web:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120

  - type: worker
    name: studyhub-worker
    env: python
    plan: free
    buildCommand: ""
    startCommand: sh start.sh
